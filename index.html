
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Rule Simulator</title>
    <style>
    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        grid-template-rows: repeat(10, 40px);
        gap: 2px;
    }
</style>
</head>
<body>

    <h1>Adaptive Rule Simulator</h1>
    <p>Our simulation environment will be built here.</p>
    <div id="grid"></div>
    <script>
    const grid = document.getElementById("grid");
    const cell = document.createElement("div");

    grid.appendChild(cell);
    </script>

</body>
</html>
