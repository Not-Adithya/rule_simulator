
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Rule Simulator</title>
    <style>
    #grid {
        display: grid;
        grid-template-columns: repeat(10, 40px);
        grid-template-rows: repeat(10, 40px);
        gap: 2px;
    }
    #grid div {
    width: 40px;
    height: 40px;
    border: 1px solid black;
    }
</style>
</head>
<body>

    <h1>Adaptive Rule Simulator</h1>
    <p>Our simulation environment will be built here.</p>
    <div id="grid"></div>
    <button onclick="moveRight()">Move Right</button>
    <button onclick="moveLeft()">Move Left</button>
    <button onclick="moveUp()">Move Up</button>
    <button onclick="moveDown()">Move Down</button>
    <script>
    let agent = {
    x: 0,
    y: 0
    };
    const grid = document.getElementById("grid");

    for (let i = 0; i < 100; i++) {
    const cell = document.createElement("div");
    grid.appendChild(cell);
    cell.dataset.x = i % 10;
    cell.dataset.y = Math.floor(i / 10);
    }
    const agentCell = document.querySelector(
    `[data-x="${agent.x}"][data-y="${agent.y}"]`
    );

    agentCell.style.backgroundColor = "red";
    function moveRight() {
    if (agent.x < 9) {
        agent.x = agent.x + 1;
        renderAgent();
    }
    }

    function moveLeft() {
    if (agent.x > 0) {
        agent.x--;
        renderAgent();
    }
    }

    function moveUp() {
    if (agent.y > 0) {
        agent.y--;
        renderAgent();
    }
    }

    function moveDown() {
    if (agent.y < 9) {
        agent.y++;
        renderAgent();
    }
    }
        
    
    
    function renderAgent() {
    document.querySelectorAll("#grid div").forEach(cell => {
        cell.style.backgroundColor = "";
    });

    const agentCell = document.querySelector(
        `[data-x="${agent.x}"][data-y="${agent.y}"]`
    );

    agentCell.style.backgroundColor = "red";
    }

    
    
   
    </script>

</body>
</html>
